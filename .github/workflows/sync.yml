name: Sync Data

on:
  schedule:
    # Steam PICS 的变更列表只保留约 5000 个 change number（约几小时）。
    # 轮询间隔必须足够短，否则中间产生的 app 会被永久跳过。
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      scan_from:
        description: '全量回填起点 appid（例如填 1；留空则只做增量同步）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install "steam[client]==1.4.4"

      - name: Download database
        run: |
          mkdir -p Data
          gh release download db --pattern data.db --dir Data --clobber || \
            echo "未找到 release，将执行全量同步"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync database
        run: |
          if [ -n "${{ github.event.inputs.scan_from }}" ]; then
            echo "手动全量回填，从 appid ${{ github.event.inputs.scan_from }} 开始"
            python sync_all_data.py --scan-from "${{ github.event.inputs.scan_from }}"
            python sync_data_daily.py || true
          elif [ -f Data/data.db ]; then
            python sync_data_daily.py || {
              echo "增量同步要求全量重建，执行回填"
              python sync_all_data.py
              python sync_data_daily.py
            }
          else
            echo "未找到数据库，执行全量同步"
            python sync_all_data.py
            python sync_data_daily.py
          fi

      - name: Upload database
        if: always()
        run: |
          if [ -f Data/data.db ]; then
            gh release upload db Data/data.db --clobber
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export JSON
        if: always()
        run: python db_to_json.py

      - name: Commit JSON
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/
          git diff --staged --quiet || git commit -m "chore(data): 自动更新 JSON 数据"
          git push
